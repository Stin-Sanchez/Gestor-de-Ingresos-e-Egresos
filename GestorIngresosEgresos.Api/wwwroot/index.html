<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestor Financiero</title>
  <!-- Aplica el tema antes de pintar para no mostrar un flash del tema contrario. -->
  <script>
    (() => {
      const stored = localStorage.getItem("tema");
      const dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-bs-theme", dark ? "dark" : "light");
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ── Login ─────────────────────────────────────────────────────────── -->
<div id="login-view" class="d-flex align-items-center justify-content-center">
  <div class="card">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <div class="brand mb-1">Gestor Financiero</div>
        <div class="text-muted-app" style="font-size:.8125rem">Ingresa para continuar</div>
      </div>
      <form id="login-form">
        <div class="mb-3">
          <label class="form-label" for="login-username">Usuario</label>
          <input type="text" class="form-control" id="login-username" required autofocus autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label" for="login-password">Contraseña</label>
          <div class="input-group">
            <input type="password" class="form-control" id="login-password" required autocomplete="current-password">
            <button class="btn btn-quiet" type="button" id="toggle-password" aria-label="Mostrar contraseña">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <div id="login-error" class="alert alert-danger py-2 px-3 d-none" style="font-size:.8125rem"></div>
        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
      </form>
    </div>
  </div>
</div>

<!-- ── App ───────────────────────────────────────────────────────────── -->
<div id="app-view" class="d-none">
  <div class="d-flex">
    <nav class="sidebar d-none d-md-flex flex-column p-3">
      <div class="brand mb-4 px-2 d-flex align-items-center gap-2">
        <i class="bi bi-pie-chart-fill" style="color:var(--app-accent)"></i> Gestor
      </div>
      <ul class="nav flex-column mb-auto gap-1">
        <li class="nav-item"><a href="#periodo" class="nav-link" data-view="periodo"><i class="bi bi-arrow-down-up"></i> Movimientos</a></li>
        <li class="nav-item"><a href="#presupuestos" class="nav-link" data-view="presupuestos"><i class="bi bi-wallet2"></i> Presupuestos</a></li>
        <li class="nav-item"><a href="#deudas" class="nav-link" data-view="deudas"><i class="bi bi-credit-card"></i> Deudas</a></li>
      </ul>
      <div class="d-flex align-items-center justify-content-between px-2 pt-3" style="border-top:1px solid var(--app-border)">
        <span class="text-muted-app text-truncate" style="font-size:.8125rem" id="nav-username"></span>
        <div class="d-flex gap-1">
          <button class="btn btn-icon btn-tema" type="button" title="Cambiar tema"><i class="bi bi-moon-stars"></i></button>
          <button class="btn btn-icon danger" type="button" id="btn-logout" title="Cerrar sesión"><i class="bi bi-box-arrow-right"></i></button>
        </div>
      </div>
    </nav>

    <main class="flex-grow-1 min-vw-0">
      <nav class="d-md-none d-flex align-items-center justify-content-between p-3" style="border-bottom:1px solid var(--app-border);background:var(--app-sidebar)">
        <button class="btn btn-icon" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobile-nav"><i class="bi bi-list fs-5"></i></button>
        <span class="brand">Gestor</span>
        <button class="btn btn-icon btn-tema" type="button"><i class="bi bi-moon-stars"></i></button>
      </nav>

      <div class="offcanvas offcanvas-start" tabindex="-1" id="mobile-nav" style="max-width:260px">
        <div class="offcanvas-header pb-2">
          <span class="brand"><i class="bi bi-pie-chart-fill me-1" style="color:var(--app-accent)"></i> Gestor</span>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body pt-0">
          <ul class="nav flex-column gap-1">
            <li class="nav-item"><a href="#periodo" class="nav-link" data-view="periodo"><i class="bi bi-arrow-down-up"></i> Movimientos</a></li>
            <li class="nav-item"><a href="#presupuestos" class="nav-link" data-view="presupuestos"><i class="bi bi-wallet2"></i> Presupuestos</a></li>
            <li class="nav-item"><a href="#deudas" class="nav-link" data-view="deudas"><i class="bi bi-credit-card"></i> Deudas</a></li>
          </ul>
          <hr style="border-color:var(--app-border)">
          <button class="btn btn-quiet btn-sm w-100" id="btn-logout-mobile"><i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión</button>
        </div>
      </div>

      <div class="p-3 p-md-4" style="max-width:1200px">
        <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3"></div>
        <section id="view-periodo" class="view d-none"></section>
        <section id="view-presupuestos" class="view d-none"></section>
        <section id="view-deudas" class="view d-none"></section>
      </div>
    </main>
  </div>
</div>

<!-- Modal generico: cada vista rellena #app-modal-body y #app-modal-title antes de mostrarlo. -->
<div class="modal fade" id="app-modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0 pb-1">
        <h5 class="modal-title fs-6 fw-semibold" id="app-modal-title"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body pt-2" id="app-modal-body"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
