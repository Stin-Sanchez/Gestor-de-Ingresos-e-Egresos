services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: GestorIngresosDB
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/init-db/00-usuarios.sql:/docker-entrypoint-initdb.d/00-usuarios.sql:ro
      - ./docs/sql/migration_v2.sql:/docker-entrypoint-initdb.d/01-migration_v2.sql:ro
      - ./docs/sql/migration_v3.sql:/docker-entrypoint-initdb.d/02-migration_v3.sql:ro
      - ./docs/sql/migration_v4.sql:/docker-entrypoint-initdb.d/03-migration_v4.sql:ro
      - ./docs/sql/migration_v5.sql:/docker-entrypoint-initdb.d/04-migration_v5.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Nodo propio en la tailnet, para no chocar con el puerto 443 que ya usa la otra
  # app del server. Publica la API en https://<hostname>.<tailnet>.ts.net
  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-gestor}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?falta TS_AUTHKEY en el archivo .env}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./docker/tailscale/serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    ports:
      # Acceso directo por IP dentro de la LAN, sin pasar por la tailnet.
      - "8081:8080"

  api:
    build: ./GestorIngresosEgresos.Api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    # Comparte la pila de red del sidecar para que "tailscale serve" pueda
    # proxear a 127.0.0.1:8080. Por eso los puertos se declaran alla, no aqui.
    network_mode: service:tailscale
    environment:
      ConnectionStrings__Default: "Server=mysql;Port=3306;Database=GestorIngresosDB;Uid=root;Pwd=${MYSQL_ROOT_PASSWORD:-root};"
      Avatares__Directorio: /app/data/avatares
    volumes:
      # Los avatares son archivos: sin volumen se perderian en cada rebuild de la imagen.
      - avatares:/app/data/avatares

volumes:
  mysql-data:
  avatares:
  tailscale-state:
